# What the Boiler needs to work on this repository: the tools its Station is
# hydrated with, and the commands a hand may run. It is mise configuration,
# read by the factory from the default branch only. A task is one command,
# run with no shell.
#
# After changing [tools], refresh the lock and commit it beside this file:
#
#   MISE_OVERRIDE_CONFIG_FILENAMES=.boiler/station.toml mise lock

# The justfile's check and test recipes first run `setup`, which installs
# git hooks. On a Station a line is a worktree of a shared clone, so the hooks
# would land on every line. The tasks below are those recipes' own commands.

[tools]
python = "3.14"
uv = "0.13.9"
# pyright runs on Node.
node = "22"

[tasks.format]
run = "uv run ruff format --check src tests"

[tasks.lint]
run = "uv run ruff check src tests"

[tasks.types]
run = "uv run pyright src tests"

[tasks.test]
run = "uv run pytest tests"
